spring.application.name=notification-service

server.port=8083

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9092

# Kafka consumer configuration
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=startup.vn.notificationservice.event
spring.kafka.listener.missing-topics-fatal=false

app.kafka.topics.medicine-stock-events=medicine-stock-events
